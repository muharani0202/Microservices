
services:

  # ==================== PRODUCT SERVICE ====================
  product-service:
    build: ./product-service
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: product-db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: productdb
    depends_on:
      product-db:
        condition: service_healthy

  product-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ==================== CART SERVICE ====================
  cart-service:
    build: ./cart-service
    ports:
      - "3001:3001"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ""

      PORT: "3001"
      DB_CONNECTION: pgsql
      DB_HOST: cart-db
      DB_PORT: "5432"
      DB_DATABASE: cartdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword

      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file

      PRODUCT_SERVICE_URL: http://product-service:3000

    volumes:
      - cart-app-key:/var/lib/app-key

    command: >
      sh -c "
      set -e &&
      mkdir -p /var/lib/app-key &&
      if [ ! -s /var/lib/app-key/APP_KEY ]; then
        php -r 'echo \"base64:\".base64_encode(random_bytes(32));' > /var/lib/app-key/APP_KEY;
      fi &&
      export APP_KEY=$$(cat /var/lib/app-key/APP_KEY) &&
      chmod -R 777 storage bootstrap/cache &&
      php artisan config:clear &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=3001
      "

    depends_on:
      cart-db:
        condition: service_healthy
      product-service:
        condition: service_started


  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5433:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==================== REVIEW SERVICE ====================
  review-service:
    build: ./review-service
    ports:
      - "3002:3002"


  # ==================== ORDER SERVICE (UTS) ====================
  order-service:
    build: ./order-service
    ports:
      - "3003:8000"

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ""

      PORT: "8000"
      DB_CONNECTION: mysql
      DB_HOST: order-db
      DB_PORT: "3306"
      DB_DATABASE: orderdb
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

      SESSION_DRIVER: file
      CACHE_STORE: file

      CART_SERVICE_URL: http://cart-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3000

    volumes:
      - order-app-key:/var/lib/app-key

    command: >
      sh -c "
      set -e &&
      mkdir -p /var/lib/app-key &&
      if [ ! -s /var/lib/app-key/APP_KEY ]; then
        php -r 'echo \"base64:\".base64_encode(random_bytes(32));' > /var/lib/app-key/APP_KEY;
      fi &&
      export APP_KEY=$$(cat /var/lib/app-key/APP_KEY) &&
      chmod -R 777 storage bootstrap/cache &&
      php artisan config:clear &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

    depends_on:
      order-db:
        condition: service_healthy


  order-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: orderdb
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


# ==================== PERSISTENT VOLUMES ====================
volumes:
  product-db-data:
  cart-db-data:
  order-db-data:
  cart-app-key:
  order-app-key:
